name: Publish to npm

on:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets npm sign a provenance attestation for this build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing (OIDC) needs npm >= 11.5.1
      - run: npm install -g npm@latest

      - run: npm ci

      - run: npm test

      # Trusted publishing: npm verifies this workflow via OIDC — no token.
      # The package disallows token publishes, so a leaked token can't ship.
      # --provenance links the tarball to this commit + workflow run.
      - name: Publish
        run: npm publish --provenance --access public
